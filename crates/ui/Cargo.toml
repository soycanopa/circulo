[package]
name = "circulo-ui"
description = "GPUI views for Circulo: sidebar, transcript, composer and right panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
# Local dates for the sidebar's day groups and relative times.
chrono = "0.4"
async-channel.workspace = true
circulo-protocol.workspace = true
gpui.workspace = true
# CommonMark parsing for transcript text. No HTML rendering and no CLI, so the
# html and getopts default features stay off.
pulldown-cmark = { version = "0.13.6", default-features = false }
