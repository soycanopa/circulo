[package]
name = "circulo-ui"
description = "GPUI views for Circulo: sidebar, transcript, composer and right panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
# Local dates for the sidebar's day groups and relative times.
chrono = "0.4"
async-channel.workspace = true
circulo-protocol.workspace = true
gpui.workspace = true
# Settings values travel as JSON on the wire and in the store.
serde_json.workspace = true
# CommonMark parsing for transcript text. No HTML rendering and no CLI, so the
# html and getopts default features stay off.
pulldown-cmark = { version = "0.13.6", default-features = false }
# Display math: RaTeX lays out TeX and rasterizes it once; the PNG is cached
# and handed to GPUI as a RenderImage.
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-render = { version = "0.1.16", features = ["embed-fonts"] }
ratex-types = "0.1.16"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
