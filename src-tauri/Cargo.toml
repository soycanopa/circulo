[package]
name = "circulo"
version = "0.1.0"
description = "Circulo — desktop ACP client for coding agents"
authors = ["Carlos Andres O. P."]
license = "MIT"
edition = "2021"
default-run = "circulo"

[lib]
name = "circulo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "circulo-mcp"
path = "src/bin/circulo-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = "1.2"
portable-pty = "0.8"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
