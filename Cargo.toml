[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/soycanopa/circulo"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "local-offset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
gpui = "0.2.2"
ureq = { version = "2.12", features = ["json"] }
pulldown-cmark = { version = "0.13", default-features = false }
circulo-core = { path = "crates/circulo-core" }
circulo-protocol = { path = "crates/circulo-protocol" }
circulo-adapter = { path = "crates/circulo-adapter" }
circulo-adapter-fake = { path = "crates/circulo-adapter-fake" }
circulo-adapter-opencode = { path = "crates/circulo-adapter-opencode" }
circulo-adapter-commandcode = { path = "crates/circulo-adapter-commandcode" }
circulo-persist = { path = "crates/circulo-persist" }
circulo-i18n = { path = "crates/circulo-i18n" }
circulo-markdown = { path = "crates/circulo-markdown" }
