[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/soycanopa/circulo"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
circulo-core = { path = "crates/circulo-core" }
circulo-protocol = { path = "crates/circulo-protocol" }
circulo-adapter = { path = "crates/circulo-adapter" }
circulo-adapter-fake = { path = "crates/circulo-adapter-fake" }
circulo-adapter-opencode = { path = "crates/circulo-adapter-opencode" }
circulo-persist = { path = "crates/circulo-persist" }
circulo-i18n = { path = "crates/circulo-i18n" }
circulo-markdown = { path = "crates/circulo-markdown" }
