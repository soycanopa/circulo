[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/client",
    "crates/core",
    "crates/daemon",
    "crates/git",
    "crates/persistence",
    "crates/protocol",
    "crates/providers/demo",
    "crates/providers/driver",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/soycanopa/circulo"

[workspace.dependencies]
# GPUI is the window, layout and rendering layer. The UI is native; there is
# no web view in the transcript, the sidebar or the composer.
gpui = "0.2.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# The transport. TLS features are enabled by the client so `wss://` works when
# remote lands; the daemon only ever accepts an already-unwrapped connection.
tungstenite = "0.30"
async-channel = "2"

# Puzzle pieces. Dependencies point one way only.
circulo-client = { path = "crates/client" }
circulo-core = { path = "crates/core" }
circulo-protocol = { path = "crates/protocol" }
circulo-provider = { path = "crates/providers/driver" }
circulo-provider-demo = { path = "crates/providers/demo" }
circulo-ui = { path = "crates/ui" }
