name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # GPUI is macOS-primary for v1.0 and needs the macOS SDK to build. Linux
    # joins the matrix once its system dependencies are part of the setup.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          cargo --version
          rustc --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace
